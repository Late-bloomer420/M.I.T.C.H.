<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miTch Secure Environment</title>
    <!-- xterm.js CSS would be linked here -->
    <link rel="stylesheet" href="node_modules/xterm/css/xterm.css" />
    <style>
        body { background-color: #1e1e1e; color: #ddd; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #browser-view { flex: 1; border-bottom: 2px solid #333; display: flex; align-items: center; justify-content: center; }
        #terminal-container { height: 300px; background: #000; padding: 10px; }
        .locked { filter: grayscale(100%) blur(5px); pointer-events: none; }
        #lock-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(50,0,0,0.9); color: red; display: none; align-items: center; justify-content: center; font-size: 3em; z-index: 999; flex-direction: column; }
    </style>
</head>
<body>
    <div id="lock-overlay">
        🔒 SYSTEM LOCKED
        <div id="lock-reason" style="font-size: 0.5em; margin-top: 20px; color: white;"></div>
    </div>

    <!-- Simulating the "Headless Browser" View -->
    <div id="browser-view">
        <h1>☁️ Cloud AI Interface (Isolated)</h1>
        <!-- In real implementation, this would be a BrowserView or iframe -->
    </div>

    <!-- Secure Terminal -->
    <div id="terminal-container"></div>

    <script src="./renderer.js"></script>
</body>
</html>
