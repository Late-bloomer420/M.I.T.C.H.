<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M.I.T.C.H. Mind Map Preview</title>
  <style>
    :root {
      --bg1: #0f1724;
      --bg2: #1f2b45;
      --card: rgba(255, 255, 255, 0.12);
      --stroke: rgba(255, 255, 255, 0.22);
      --text: #f5f8ff;
      --sub: #c6d4f5;
      --accent: #7dd3fc;
      --accent2: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', Segoe UI, sans-serif;
      background: radial-gradient(circle at 10% 10%, #233563 0%, var(--bg1) 45%), linear-gradient(145deg, var(--bg1), var(--bg2));
      color: var(--text);
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      padding: 20px;
    }
    .glass {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      box-shadow: 0 18px 36px rgba(0,0,0,0.32);
    }
    .sidebar { padding: 16px; }
    .title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
    .sub { color: var(--sub); font-size: 0.9rem; margin-bottom: 14px; }
    .drop {
      border: 1.6px dashed rgba(125,211,252,0.7);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      color: var(--sub);
      transition: 180ms ease;
      margin-bottom: 12px;
    }
    .drop.over { background: rgba(125,211,252,0.15); border-color: #7dd3fc; color: #fff; }
    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: #0b1020;
      font-weight: 700;
      padding: 10px 14px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    .canvas { padding: 16px; overflow: auto; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--stroke); font-size: 0.78rem; color: var(--sub); }
    .section-title { margin: 12px 0 8px; color: #e8efff; font-weight: 600; }
    .node {
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 10px;
      min-width: 220px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 8px;
    }
    .node .k { color: var(--sub); font-size: 0.78rem; }
    .node .v { font-weight: 600; }
    .empty { color: var(--sub); margin-top: 18px; }
  </style>
</head>
<body>
  <aside class="glass sidebar">
    <div class="title">Mind Map (Apple-style)</div>
    <div class="sub">Drop a truth graph JSON to preview nodes + relationships.</div>

    <div id="drop" class="drop">
      Drag & drop <b>truth graph JSON</b><br/>
      <small>or click to choose file</small>
    </div>
    <input id="picker" type="file" accept="application/json" style="display:none" />
    <button id="sample" class="btn">Load Sample Graph</button>
  </aside>

  <main class="glass canvas">
    <div class="row">
      <span class="chip" id="scope">scope: n/a</span>
      <span class="chip" id="stats">nodes: 0 · edges: 0</span>
    </div>

    <div class="section-title">Truth Nodes</div>
    <div id="truth"></div>

    <div class="section-title">Claim Nodes</div>
    <div id="claims"></div>

    <div class="section-title">Entity Nodes</div>
    <div id="entities"></div>

    <div id="empty" class="empty">Drop a graph to render preview.</div>
  </main>

<script>
const drop = document.getElementById('drop');
const picker = document.getElementById('picker');
const scopeEl = document.getElementById('scope');
const statsEl = document.getElementById('stats');
const truthEl = document.getElementById('truth');
const claimsEl = document.getElementById('claims');
const entitiesEl = document.getElementById('entities');
const emptyEl = document.getElementById('empty');

function nodeCard(n){
  const meta = n.meta ? `<div class='k'>${Object.entries(n.meta).slice(0,4).map(([k,v])=>`${k}: ${v}`).join(' · ')}</div>` : '';
  return `<div class='node'><div class='v'>${n.label}</div><div class='k'>${n.id}</div>${meta}</div>`;
}

function render(graph){
  const nodes = graph.nodes || [];
  const edges = graph.edges || [];
  scopeEl.textContent = `scope: ${graph.scope || 'GLOBAL'}`;
  statsEl.textContent = `nodes: ${nodes.length} · edges: ${edges.length}`;

  const truth = nodes.filter(n=>n.type==='truth');
  const claims = nodes.filter(n=>n.type==='claim');
  const entities = nodes.filter(n=>n.type==='entity');

  truthEl.innerHTML = truth.map(nodeCard).join('') || '<div class="empty">No truth nodes</div>';
  claimsEl.innerHTML = claims.map(nodeCard).join('') || '<div class="empty">No claim nodes</div>';
  entitiesEl.innerHTML = entities.map(nodeCard).join('') || '<div class="empty">No entity nodes</div>';
  emptyEl.style.display = 'none';
}

async function readFile(file){
  const txt = await file.text();
  const graph = JSON.parse(txt);
  render(graph);
}

['dragenter','dragover'].forEach(evt=>drop.addEventListener(evt,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(evt=>drop.addEventListener(evt,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) readFile(f); });
drop.addEventListener('click', ()=>picker.click());
picker.addEventListener('change', ()=>{ const f=picker.files[0]; if(f) readFile(f); });

document.getElementById('sample').addEventListener('click', ()=>{
  render({
    scope:'MINDMAP',
    nodes:[
      {id:'truth:1',type:'truth',label:'Alice is CEO',meta:{confidence:90}},
      {id:'claim:c1',type:'claim',label:'Alice is CEO',meta:{sourceType:'text',sourceId:'notes/a.txt'}},
      {id:'claim:c2',type:'claim',label:'Alice is CTO',meta:{sourceType:'transcript',sourceId:'meeting/1'}},
      {id:'entity:Alice',type:'entity',label:'Alice'},
      {id:'entity:CEO',type:'entity',label:'CEO'},
      {id:'entity:CTO',type:'entity',label:'CTO'}
    ],
    edges:[
      {id:'e1',from:'claim:c1',to:'truth:1',type:'supports'},
      {id:'e2',from:'claim:c1',to:'claim:c2',type:'conflicts_with'},
      {id:'e3',from:'entity:Alice',to:'claim:c1',type:'about'},
      {id:'e4',from:'claim:c1',to:'entity:CEO',type:'about'}
    ]
  });
});
</script>
</body>
</html>
